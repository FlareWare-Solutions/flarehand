schema_version: "1.1"
name: ignores-generic-sql
tags: [near-miss]
execution:
  max_turns: 5
  timeout_seconds: 150
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |-
    Write a SQL query that returns the top 10 customers by total order value from orders(customer_id, amount).
graders:
  - name: answers-directly
    type: llm
    weight: 1
    criteria: |-
      The user asked for a SQL query returning the top 10 customers by total order value from orders(customer_id, amount). PASS if this condition holds, FAIL if it does not:
      It answers the request directly: it writes the query.
  - name: no-workflow
    type: regex
    target: last_message
    match: not_contains
    flags: i
    weight: 1
    pattern: 'knowledge base|playbook|\[ASSUMPTION|Keep any of this|flareware'
  - name: not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flarehand(?:-(?:remember|ground|grill|review))?"'
    min: 0
    max: 0
    arm: both
    weight: 2
