schema_version: "1.1"
name: course-announcement-keeps-the-facts
tags: [trigger, education, outbound]
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |-
    I'm a TA. Write a short announcement for my section: the Lab 3 deadline moves from Oct 10 to Oct 14 because the compute cluster was down for two days. The late penalty stays the same. Office hours this week are Thursday 3 to 5 pm in room B204.
graders:
  - name: adds-nothing
    type: llm
    weight: 1
    criteria: |-
      A teaching assistant asked for a short announcement for their section. PASS if this condition holds, FAIL if it does not:
      The announcement text itself adds no rule, submission step, link, deadline or interpretation beyond the facts given. An added interpretive sentence inside the announcement, such as "the penalty counts from the new deadline", is a FAIL. A subject line, a greeting, a sign-off or a name placeholder is fine. Notes or questions to the user after the draft are fine.
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flarehand(?:-(?:remember|ground|grill|review))?"'
    arm: with-only
  - name: keeps-the-facts
    type: llm
    weight: 2
    criteria: |-
      A teaching assistant asked for a short announcement for their section. PASS if this condition holds, FAIL if it does not:
      The announcement says the Lab 3 deadline moves from Oct 10 to Oct 14 because the compute cluster was down for two days, the late penalty stays the same, and office hours this week are Thursday 3 to 5 pm in room B204.
  - name: no-invented-penalty
    type: regex
    target: last_message
    match: not_contains
    flags: i
    weight: 2
    pattern: '\d+\s?%|per day late|points? (off|deducted)'
  - name: writes-it
    type: llm
    weight: 1
    criteria: |-
      A teaching assistant asked for a short announcement for their section. PASS if this condition holds, FAIL if it does not:
      It contains a short announcement ready to post.
