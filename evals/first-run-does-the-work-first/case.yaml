schema_version: "1.1"
name: first-run-does-the-work-first
tags: [trigger, first-run, memory, writeup]
execution:
  max_turns: 25
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |-
    Write a help article for our support site on resetting two-factor authentication for a user in the Northwind admin console. Steps: go to Admin > Users, search for the user, open their profile, click Reset 2FA, then tell the user to sign in again and enroll a new device. Only workspace owners and admins can do this. Every reset is recorded in the audit log.
graders:
  - name: article-first
    type: llm
    weight: 2
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      The complete help article comes first in the reply, before any question about the user.
  - name: article-keeps-the-facts
    type: llm
    weight: 2
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      The article has these steps in order: go to Admin > Users, search for the user, open their profile, click Reset 2FA, tell the user to sign in again and enroll a new device. It says only workspace owners and admins can do this, and that every reset is recorded in the audit log.
  - name: asks-kb-consent
    type: regex
    target: last_message
    match: contains
    flags: i
    weight: 1
    pattern: 'knowledge base'
  - name: claims-nothing-saved
    type: llm
    weight: 1
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      FAIL only if it says, in the past tense, that something was already saved, stored, logged or set up. Offering to keep a knowledge base if the user agrees is fine.
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flarehand(?:-(?:remember|ground|grill|review))?"'
    arm: with-only
  - name: kb-consent-asked
    type: llm
    weight: 2
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      It asks permission before keeping a private knowledge base, with a choice such as "yes" or "just this session".
  - name: no-invented-ui
    type: llm
    weight: 1
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      The article adds no menu, screen, role or step beyond the ones listed above. Marking something as missing is fine.
  - name: no-job-title
    type: llm
    weight: 1
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      It does not ask the user for their own job title. Asking what they work on, or asking for a client contact's name or title, is fine.
  - name: no-kb-write
    type: tool_used
    tool: Bash
    input_match: 'kb\.py[\\"]*\s+(?:init|note|log\s+workflow|template\s+save|glossary\s+add|rule\s+add|choice)\b|answers\.py[\\"]*\s+write\b'
    min: 0
    max: 0
    arm: both
    weight: 2
  - name: optional-questions-after
    type: llm
    weight: 2
    criteria: |-
      In their first session with the tool, the user asked for a help article on resetting two-factor authentication in the Northwind admin console, and gave the steps and rules. PASS if this condition holds, FAIL if it does not:
      After the article, it offers at most three optional questions about the user (such as what they work on, who reads their work, or a writing sample) and says they can skip them.
  - name: ran-doctor
    type: tool_used
    tool: Bash
    input_match: 'doctor\.py'
    arm: with-only
    weight: 1
