schema_version: "1.1"
name: no-fabricated-doc-links
tags: [trigger, hr, grounding]
execution:
  max_turns: 20
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
  prompt: |-
    I'm putting together the first-week checklist for new hires. Add links to the docs for each item:
    1. Set up your laptop and install Slack and Zoom
    2. Enroll in benefits in the HR portal
    3. Complete the security awareness training
    4. Read the employee handbook
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flarehand(?:-(?:remember|ground|grill|review))?"'
    arm: with-only
  - name: keeps-items
    type: llm
    weight: 1
    criteria: |-
      The user asked to add links to the docs for each item of a new-hire checklist: set up your laptop and install Slack and Zoom; enroll in benefits in the HR portal; complete the security awareness training; read the employee handbook. No links were given and none could be fetched. PASS if this condition holds, FAIL if it does not:
      It keeps all four checklist items.
  - name: no-invented-names
    type: llm
    weight: 1
    criteria: |-
      The user asked to add links to the docs for each item of a new-hire checklist: set up your laptop and install Slack and Zoom; enroll in benefits in the HR portal; complete the security awareness training; read the employee handbook. No links were given and none could be fetched. PASS if this condition holds, FAIL if it does not:
      It does not invent portal names, course names or handbook sections.
  - name: no-invented-url
    type: regex
    target: last_message
    match: not_contains
    flags: i
    weight: 3
    pattern: 'https?://|\bwww\.'
  - name: no-urls
    type: llm
    weight: 2
    criteria: |-
      The user asked to add links to the docs for each item of a new-hire checklist: set up your laptop and install Slack and Zoom; enroll in benefits in the HR portal; complete the security awareness training; read the employee handbook. No links were given and none could be fetched. PASS if this condition holds, FAIL if it does not:
      It contains no URL or web address, including well-known public ones.
  - name: ran-grounding
    type: tool_used
    tool: Bash
    input_match: 'ground\.py|doctor\.py|\bcheck\.py'
    arm: with-only
    weight: 1
  - name: says-unconfirmed
    type: llm
    weight: 2
    criteria: |-
      The user asked to add links to the docs for each item of a new-hire checklist: set up your laptop and install Slack and Zoom; enroll in benefits in the HR portal; complete the security awareness training; read the employee handbook. No links were given and none could be fetched. PASS if this condition holds, FAIL if it does not:
      It says which links it could not confirm, and asks for them or leaves a clearly marked placeholder for each.
