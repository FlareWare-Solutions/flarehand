schema_version: "1.1"
name: ignores-refactor-with-ticket-key
tags: [near-miss]
execution:
  max_turns: 5
  timeout_seconds: 150
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: |-
    For TOOL-1234, refactor this into a list comprehension: def f(xs):
        out = []
        for x in xs:
            out.append(x * 2)
        return out
graders:
  - name: answers-directly
    type: llm
    weight: 1
    criteria: |-
      The user mentioned ticket TOOL-1234 and asked to refactor a loop that doubles each item of a list into a list comprehension. PASS if this condition holds, FAIL if it does not:
      It answers the request directly: it returns the refactored function.
  - name: no-workflow
    type: regex
    target: last_message
    match: not_contains
    flags: i
    weight: 1
    pattern: 'knowledge base|playbook|\[ASSUMPTION|Keep any of this|flareware'
  - name: not-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?flarehand(?:-(?:remember|ground|grill|review))?"'
    min: 0
    max: 0
    arm: both
    weight: 2
